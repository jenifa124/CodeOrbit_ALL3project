<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My To-Do List | CodeOrbit</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><p class="eyebrow">CODEORBIT TECH • TASK 2</p><h1>My To-Do List</h1><p>Stay organized, one task at a time.</p></header><form id="taskForm" class="input-row"><label class="sr-only" for="taskInput">New task</label><input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="150" required><button type="submit">Add Task</button></form><div class="toolbar"><span id="taskCount" aria-live="polite">0 tasks remaining</span><button id="clearCompleted" class="text-btn" type="button">Clear completed</button></div><ul id="taskList" aria-label="Tasks"></ul><p id="emptyState" class="empty">No tasks yet. Add your first task!</p><footer>Tasks are saved automatically in this browser.</footer></main><script src="script.js"></script></body></html>
